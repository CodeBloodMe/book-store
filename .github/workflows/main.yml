name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Build-only values; the workflow never connects to a live project.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_db?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-placeholder
      SUPABASE_SECRET_KEY: ci-secret-placeholder-not-a-real-key
      CRON_SECRET: ci-cron-secret-placeholder-that-is-not-real
      GEMINI_API_KEY: ci-gemini-placeholder
      GROQ_API_KEY: ci-groq-placeholder
      OPENAI_API_KEY: ci-openai-placeholder
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Validate Prisma schema
      run: npx prisma validate
      
    - name: Run linter
      run: npm run lint

    - name: Check TypeScript
      run: npm run typecheck
      
    - name: Run unit tests
      run: npm test --if-present
      
    - name: Build Application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
